  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #000;
    color: #fff;
    overflow: hidden;
  }
  .mark {
    width: min(92vw, 880px);
    height: auto;
    display: block;
    overflow: visible;
  }
  #heroMark {
    position: fixed;
    top: 24px;
    left: 24px;
    width: auto;
    height: 32px;
    visibility: hidden;
    opacity: 0;
  }
  @media (max-width: 640px) {
    #heroMark { top: 16px; left: 16px; height: 28px; }
  }
  .cap {
    font-family: "Manrope", system-ui, sans-serif;
    font-weight: 300;
    font-size: 540px;
    fill: #fff;
  }
  .ring {
    fill: none;
    stroke: #fff;
    stroke-width: 17;
    stroke-linecap: round;
  }
  .hero {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
  }
  #intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: #000;
    transition: opacity .55s ease, visibility .55s ease;
  }
  #intro .cap {
    opacity: 0;
    transform: translateX(-60px);
    transition: opacity .38s cubic-bezier(.22,.61,.36,1), transform .38s cubic-bezier(.22,.61,.36,1);
  }
  #intro .cap.in { opacity: 1; transform: translateX(0); }
  #intro.move { background: transparent; pointer-events: none; }
  #introMark { will-change: transform; }
  #stem { opacity: 0; animation: stem-in .32s ease-out forwards; }
  @keyframes stem-in { to { opacity: 1; } }
  #dot { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    #intro { display: none; }
    #stem { animation: none; opacity: 1; }
    #heroMark { visibility: visible; opacity: 1; }
  }
</style>

<script>
(() => {
  const intro = document.getElementById('intro');
  const introMark = document.getElementById('introMark');
  const heroMark = document.getElementById('heroMark');
  const introLockup = document.getElementById('introLockup');
  const ring = document.getElementById('ring');
  const dot = document.getElementById('dot');
  const capsIntro = [...document.querySelectorAll('#caps .cap')];
  const capsHero = [...document.querySelectorAll('#heroMark .cap')];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const START_X = 728;
  const GAP = 10;
  const BADGE_W = 672;

  async function layout() {
    try {
      await document.fonts.load('300 540px "Manrope"');
      await document.fonts.ready;
    } catch (e) {}
    function measure(caps) {
      let x = START_X;
      for (const el of caps) {
        el.setAttribute('x', x);
        x += el.getComputedTextLength() + GAP;
      }
      return Math.ceil(x - GAP);
    }
    const width = Math.max(measure(capsIntro), measure(capsHero));
    introMark.setAttribute('viewBox', `0 0 ${width} 672`);
    heroMark.setAttribute('viewBox', `0 0 ${width} 672`);
    return width;
  }

  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  function start(width) {
    const shift0 = (width - BADGE_W) / 2;
    introLockup.setAttribute('transform', `translate(${shift0} 0)`);

    const brandH = heroMark.getBoundingClientRect().height;
    heroMark.style.width = `${(brandH * width) / 672}px`;
    const brandRect = heroMark.getBoundingClientRect();
    const target = { x: brandRect.left, y: brandRect.top, h: brandH };

    let loaded = document.readyState === 'complete';
    window.addEventListener('load', () => { loaded = true; }, { once: true });

    const T = {
      dotStart: 320, dotFall: 400, bounce: 160,
      ringDur: 900, ringClose: 280,
      letterGap: 65, recenter: 650,
      hold: 400, shrink: 700
    };

    const t0 = performance.now();
    let impactAt = null, closeStart = null, lettersStart = null, doneAt = null;

    function finishMove() {
      intro.style.background = 'transparent';
      intro.style.pointerEvents = 'none';
    }

    function frame(now) {
      const dt = now - t0;

      if (dt < T.dotStart) {
        dot.style.opacity = '0';
        dot.setAttribute('transform', 'translate(0 -260)');
      } else if (dt < T.dotStart + T.dotFall) {
        const p = (dt - T.dotStart) / T.dotFall;
        dot.style.opacity = '1';
        dot.setAttribute('transform', `translate(0 ${(-260 * (1 - p * p)).toFixed(2)})`);
      } else {
        if (impactAt === null) impactAt = now;
        dot.style.opacity = '1';
        const b = Math.min(1, (now - impactAt) / T.bounce);
        const ty = -14 * Math.sin(Math.PI * b);
        const sy = 1 - .10 * Math.sin(Math.PI * b);
        const sx = 1 + .06 * Math.sin(Math.PI * b);
        dot.setAttribute('transform', b < 1
          ? `translate(0 ${ty.toFixed(2)}) translate(512 333.5) scale(${sx.toFixed(3)} ${sy.toFixed(3)}) translate(-512 -333.5)`
          : 'translate(0 0)');
      }

      if (impactAt !== null) {
        if (closeStart === null) {
          const p = Math.min(1, (now - impactAt) / T.ringDur);
          ring.style.strokeDashoffset = String(100 - 90 * easeOutCubic(p));
          if (p >= 1 && loaded) closeStart = now;
        } else {
          const c = Math.min(1, (now - closeStart) / T.ringClose);
          ring.style.strokeDashoffset = String(10 * (1 - easeOutCubic(c)));
          if (c >= 1) {
            ring.style.strokeDashoffset = '0';
            if (lettersStart === null) lettersStart = now;
          }
        }
      }

      if (lettersStart !== null) {
        const since = now - lettersStart;
        capsIntro.forEach((el, i) => {
          if (since >= i * T.letterGap) el.classList.add('in');
        });
        const r = Math.min(1, since / T.recenter);
        introLockup.setAttribute('transform', `translate(${(shift0 * (1 - easeInOutCubic(r))).toFixed(2)} 0)`);

        const lettersEnd = (capsIntro.length - 1) * T.letterGap + 380;
        if (doneAt === null && since >= lettersEnd + T.hold) {
          doneAt = now;
          const from = introMark.getBoundingClientRect();
          const dx = target.x - from.left;
          const dy = target.y - from.top;
          const scale = target.h / from.height;
          introMark.style.transformOrigin = '0 0';
          introMark.style.transition = `transform ${T.shrink}ms cubic-bezier(.45, 0, .2, 1)`;
          introMark.getBoundingClientRect();
          introMark.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) scale(${scale.toFixed(4)})`;
          intro.style.transition = `background-color ${T.shrink}ms cubic-bezier(.45, 0, .2, 1)`;
          intro.classList.add('move');
          introMark.addEventListener('transitionend', finishMove, { once: true });
          setTimeout(finishMove, T.shrink + 200);
          return;
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  layout().then(width => {
    if (reduced) {
      heroMark.style.visibility = 'visible';
      heroMark.style.opacity = '1';
      intro.remove();
      return;
    }
    start(width);
  }).catch(() => {
    heroMark.style.visibility = 'visible';
    heroMark.style.opacity = '1';
    intro.remove();
  });
})();
</script>
</body>
</html>
