  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #000;
    color: #fff;
    overflow: hidden;
  }
  .mark {
    width: min(92vw, 880px);
    height: auto;
    display: block;
    overflow: visible;
  }
  .cap {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 500;
    font-size: 540px;
    fill: #fff;
  }
  .ring {
    fill: none;
    stroke: #fff;
    stroke-width: 17;
    stroke-linecap: round;
  }
  .hero {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
  }
  #intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: #000;
    transition: opacity .55s ease, visibility .55s ease;
  }
  #intro.done { opacity: 0; visibility: hidden; }
  #intro .cap {
    opacity: 0;
    transform: translateX(-60px);
    transition: opacity .38s cubic-bezier(.22,.61,.36,1), transform .38s cubic-bezier(.22,.61,.36,1);
  }
  #intro .cap.in { opacity: 1; transform: translateX(0); }
  #stem { opacity: 0; animation: stem-in .32s ease-out forwards; }
  @keyframes stem-in { to { opacity: 1; } }
  #dot { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    #intro { display: none; }
    #stem { animation: none; opacity: 1; }
  }
</style>

<noscript><style>#intro { display: none; } .caps { display: none; }</style></noscript>

<script>
(() => {
  const intro = document.getElementById('intro');
  const introMark = document.getElementById('introMark');
  const heroMark = document.getElementById('heroMark');
  const introLockup = document.getElementById('introLockup');
  const ring = document.getElementById('ring');
  const dot = document.getElementById('dot');
  const sound = document.getElementById('dropSound');
  const capsIntro = [...document.querySelectorAll('#caps .cap')];
  const capsHero = [...document.querySelectorAll('#heroMark .cap')];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const START_X = 728;
  const GAP = 6;
  const BADGE_W = 672;

  async function layout() {
    try {
      await document.fonts.load('500 540px "Playfair Display"');
      await document.fonts.ready;
    } catch (e) {}
    function measure(caps) {
      let x = START_X;
      for (const el of caps) {
        el.setAttribute('x', x);
        x += el.getComputedTextLength() + GAP;
      }
      return Math.ceil(x - GAP);
    }
    const width = Math.max(measure(capsIntro), measure(capsHero));
    introMark.setAttribute('viewBox', `0 0 ${width} 672`);
    heroMark.setAttribute('viewBox', `0 0 ${width} 672`);
    return width;
  }

  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  function playSound() {
    try {
      sound.currentTime = 0;
      const p = sound.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function start(width) {
    const shift0 = (width - BADGE_W) / 2;
    introLockup.setAttribute('transform', `translate(${shift0} 0)`);

    let loaded = document.readyState === 'complete';
    window.addEventListener('load', () => { loaded = true; }, { once: true });

    const T = {
      dotStart: 320, dotFall: 400, bounce: 160,
      ringDur: 900, ringClose: 280,
      letterGap: 65, recenter: 650,
      hold: 400
    };

    const t0 = performance.now();
    let impactAt = null, closeStart = null, lettersStart = null, doneAt = null;

    function frame(now) {
      const dt = now - t0;

      if (dt < T.dotStart) {
        dot.style.opacity = '0';
        dot.setAttribute('transform', 'translate(0 -260)');
      } else if (dt < T.dotStart + T.dotFall) {
        const p = (dt - T.dotStart) / T.dotFall;
        dot.style.opacity = '1';
        dot.setAttribute('transform', `translate(0 ${(-260 * (1 - p * p)).toFixed(2)})`);
      } else {
        if (impactAt === null) {
          impactAt = now;
          playSound();
        }
        const b = Math.min(1, (now - impactAt) / T.bounce);
        const ty = -14 * Math.sin(Math.PI * b);
        const sy = 1 - .10 * Math.sin(Math.PI * b);
        const sx = 1 + .06 * Math.sin(Math.PI * b);
        dot.style.opacity = '1';
        dot.setAttribute('transform', b < 1
          ? `translate(0 ${ty.toFixed(2)}) translate(512 333.5) scale(${sx.toFixed(3)} ${sy.toFixed(3)}) translate(-512 -333.5)`
          : 'translate(0 0)');
      }

      if (impactAt !== null) {
        if (closeStart === null) {
          const p = Math.min(1, (now - impactAt) / T.ringDur);
          ring.style.strokeDashoffset = String(100 - 90 * easeOutCubic(p));
          if (p >= 1 && loaded) closeStart = now;
        } else {
          const c = Math.min(1, (now - closeStart) / T.ringClose);
          ring.style.strokeDashoffset = String(10 * (1 - easeOutCubic(c)));
          if (c >= 1) {
            ring.style.strokeDashoffset = '0';
            if (lettersStart === null) lettersStart = now;
          }
        }
      }

      if (lettersStart !== null) {
        const since = now - lettersStart;
        capsIntro.forEach((el, i) => {
          if (since >= i * T.letterGap) el.classList.add('in');
        });
        const r = Math.min(1, since / T.recenter);
        introLockup.setAttribute('transform', `translate(${(shift0 * (1 - easeInOutCubic(r))).toFixed(2)} 0)`);

        const lettersEnd = (capsIntro.length - 1) * T.letterGap + 380;
        if (doneAt === null && since >= lettersEnd + T.hold) {
          doneAt = now;
          intro.classList.add('done');
        }
      }

      if (doneAt !== null && now - doneAt >= 900) {
        intro.remove();
        return;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  layout().then(width => {
    if (reduced) { intro.remove(); return; }
    start(width);
  }).catch(() => intro.remove());
})();
</script>
